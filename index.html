<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A5C;
  --navy-dark:#0F2440;
  --navy-mid:#2A4E73;
  --gold:#C8A04A;
  --gold-light:#E8C87A;
  --bg:#F4F6F9;
  --surface:#FFFFFF;
  --border:#E1E6EE;
  --text:#1A2B3C;
  --text-sec:#5A6A7E;
  --text-hint:#8A9AB0;
  --accent:#1E6BBA;
  --accent-light:#EBF4FF;
  --danger:#C0392B;
  --danger-bg:#FDF0EE;
  --success:#1A7A4A;
  --success-bg:#EBF7F1;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
/* HEADER */
.header{background:var(--navy);color:#fff;padding:0 1.5rem;height:60px;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.header-brand-icon{width:32px;height:32px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-search{flex:1;max-width:420px;position:relative}
.header-search input{width:100%;padding:8px 12px 8px 38px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.1);color:#fff;font-size:14px;outline:none;transition:border .15s,background .15s}
.header-search input::placeholder{color:rgba(255,255,255,0.5)}
.header-search input:focus{border-color:var(--gold-light);background:rgba(255,255,255,0.15)}
.header-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.5);pointer-events:none}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-ghost{background:rgba(255,255,255,0.1);color:#fff;border:1.5px solid rgba(255,255,255,0.2)}
.btn-ghost:hover{background:rgba(255,255,255,0.18)}
.btn-gold{background:var(--gold);color:var(--navy-dark);border:none}
.btn-gold:hover{background:var(--gold-light)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1558a0}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn svg{width:16px;height:16px}
/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-section{padding:16px 12px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-hint)}
.sidebar-filters{padding:0 12px 12px;flex:1;overflow-y:auto}
.filter-group{margin-bottom:14px}
.filter-label{font-size:12px;font-weight:600;color:var(--text-sec);margin-bottom:6px;display:block}
.filter-select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--accent)}
.filter-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;max-height:220px;overflow-y:auto}
.filter-tag{padding:4px 8px;border-radius:5px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:#fff;color:var(--text-sec);white-space:nowrap;transition:all .12s}
.filter-tag:hover{border-color:var(--accent);color:var(--accent)}
.filter-tag.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:500}
.sidebar-stats{padding:12px;border-top:1px solid var(--border);background:var(--bg)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px}
.stat-val{font-weight:700;color:var(--navy);font-size:15px}
.clear-btn{width:100%;margin-top:10px;padding:8px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text-sec);font-size:12px;cursor:pointer;font-weight:500;transition:all .15s}
.clear-btn:hover{border-color:var(--danger);color:var(--danger)}
/* MAIN */
.main{flex:1;overflow-y:auto;padding:20px}
/* DASHBOARD STATS */
.dash-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.dash-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.dash-stat-val{font-size:26px;font-weight:700;color:var(--navy);line-height:1}
.dash-stat-label{font-size:12px;color:var(--text-sec)}
.dash-stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.dash-stat-icon.blue{background:var(--accent-light);color:var(--accent)}
.dash-stat-icon.gold{background:#FDF6E9;color:#A07030}
.dash-stat-icon.green{background:var(--success-bg);color:var(--success)}
/* ACCORDION */
.accordion{display:flex;flex-direction:column;gap:8px}
.acc-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.acc-header{display:flex;align-items:center;padding:12px 16px;cursor:pointer;user-select:none;gap:10px;transition:background .12s}
.acc-header:hover{background:var(--bg)}
.acc-chevron{transition:transform .2s;color:var(--text-hint);flex-shrink:0}
.acc-header.open .acc-chevron{transform:rotate(180deg)}
.acc-name{font-weight:600;font-size:14px;color:var(--navy);flex:1}
.acc-badge{background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px}
.acc-logo{width:34px;height:34px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;letter-spacing:-1px}
.acc-body{display:none;padding:0 12px 12px}
.acc-body.open{display:block}
/* CONTACT GRID */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.contact-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;transition:border-color .15s,transform .12s}
.contact-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.card-avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.card-name{font-weight:600;font-size:13px;color:var(--text);line-height:1.3}
.card-role{font-size:11px;color:var(--text-sec);margin-top:2px;line-height:1.3}
.card-actions{display:flex;gap:5px;margin-left:auto;flex-shrink:0}
.card-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-sec);transition:all .12s;flex-shrink:0}
.card-btn:hover{border-color:var(--accent);color:var(--accent)}
.card-btn.del:hover{border-color:var(--danger);color:var(--danger)}
.card-contacts{display:flex;flex-direction:column;gap:4px}
.card-link{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sec);text-decoration:none;border-radius:5px;padding:3px 4px;transition:color .12s}
.card-link:hover{color:var(--accent)}
.card-link svg{flex-shrink:0;color:var(--text-hint)}
.card-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,30,55,0.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
.modal-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:17px;font-weight:700;color:var(--navy)}
.modal-close{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-sec)}
.modal-close:hover{border-color:var(--danger);color:var(--danger)}
.modal-body{padding:20px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-sec);margin-bottom:5px}
.form-input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;color:var(--text);outline:none;transition:border .15s;background:#fff}
.form-input:focus{border-color:var(--accent)}
.form-input.error{border-color:var(--danger)}
.form-error{font-size:11px;color:var(--danger);margin-top:4px}
.form-select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;color:var(--text);outline:none;background:#fff;cursor:pointer}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* CONFIRM */
.confirm-text{font-size:14px;color:var(--text-sec);line-height:1.6;margin-bottom:4px}
.confirm-name{font-weight:700;color:var(--text)}
/* EXPORT */
.export-menu{position:absolute;top:100%;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);min-width:160px;z-index:150;overflow:hidden}
.export-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);transition:background .12s}
.export-item:hover{background:var(--bg)}
.export-wrap{position:relative}
/* VIEW TOGGLE */
.view-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.view-btn{padding:6px 10px;background:#fff;border:none;cursor:pointer;color:var(--text-sec);transition:all .12s;display:flex;align-items:center}
.view-btn.active,.view-btn:hover{background:var(--accent-light);color:var(--accent)}
/* TABLE VIEW */
.contacts-table{width:100%;border-collapse:collapse;font-size:13px}
.contacts-table th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-hint);border-bottom:2px solid var(--border);background:var(--bg);position:sticky;top:0}
.contacts-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.contacts-table tr:hover td{background:var(--accent-light)}
.contacts-table a{color:var(--accent);text-decoration:none}
.contacts-table a:hover{text-decoration:underline}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.company-pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-light);color:var(--accent);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
/* ESTADO */
.estado-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.estado-badge.activo{background:var(--success-bg);color:var(--success)}
.estado-badge.baja{background:#F7DDD9;color:var(--danger)}
.contact-card.baja{background:var(--danger-bg);border-color:#F1C6C1}
.contact-card.baja:hover{border-color:var(--danger)}
.contact-card.baja .card-name{color:var(--danger)}
.contact-card.baja .card-role{color:#A9655C}
.contact-card.baja .card-link{color:#A9655C}
.contact-card.baja .card-link svg{color:#C98A82}
.contacts-table tr.baja td{background:var(--danger-bg);color:var(--danger)}
.contacts-table tr.baja:hover td{background:#F9E1DE}
.contacts-table tr.baja a{color:var(--danger)}
.card-btn.baja-btn{border-color:#F1C6C1;color:var(--danger);background:var(--danger-bg)}
.card-btn.baja-btn:hover{border-color:var(--danger);background:var(--danger);color:#fff}
.card-btn.activar-btn{border-color:#CDE7DA;color:var(--success);background:var(--success-bg)}
.card-btn.activar-btn:hover{border-color:var(--success);background:var(--success);color:#fff}
.card-btn.copy:hover{border-color:var(--success);color:var(--success)}
.card-btn.copy-mini{width:24px;height:24px}
.card-mail-row{display:flex;align-items:center;gap:4px;min-width:0}
.card-mail-row .card-link{flex:1;min-width:0}
/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.results-info{font-size:13px;color:var(--text-sec);flex:1}
.results-info strong{color:var(--text);font-weight:600}
/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--text-sec)}
.empty svg{color:var(--text-hint);margin-bottom:16px}
.empty h3{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:300;transform:translateY(80px);opacity:0;transition:all .25s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.danger{background:var(--danger)}
/* MOBILE */
.mobile-menu-btn{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:4px}
.sidebar-mobile-overlay{display:none}
@media(max-width:768px){
  .header{padding:0 12px;gap:8px}
  .header-brand span{display:none}
  .btn-gold{display:none}
  .db-label{display:none}
  .header-actions .btn{padding:7px 9px}
  .mobile-menu-btn{display:flex}
  .layout{position:relative}
  .sidebar{position:fixed;left:-240px;top:60px;bottom:0;z-index:90;transition:left .25s;box-shadow:4px 0 20px rgba(0,0,0,0.15)}
  .sidebar.open{left:0}
  .sidebar-mobile-overlay{display:none;position:fixed;inset:0;top:60px;background:rgba(0,0,0,0.4);z-index:89}
  .sidebar-mobile-overlay.open{display:block}
  .main{padding:12px}
  .dash-stats{grid-template-columns:repeat(2,1fr)}
  .contact-grid{grid-template-columns:1fr}
}
/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--text-hint)}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Menú">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="header-brand">
    <div class="header-brand-icon">
      <svg width="18" height="18" fill="none" stroke="var(--navy-dark)" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <span>Agenda Aseguradoras</span>
  </div>
  <div class="header-search">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="searchInput" placeholder="Buscar por nombre, empresa, cargo, mail, teléfono..." oninput="handleSearch()">
  </div>
  <div class="header-actions">
    <div class="export-wrap">
      <button class="btn btn-ghost" onclick="toggleExportMenu()" id="exportBtn">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Exportar
      </button>
      <div class="export-menu" id="exportMenu" style="display:none">
        <div class="export-item" onclick="exportData('xlsx')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Exportar Excel (.xlsx)
        </div>
        <div class="export-item" onclick="exportData('csv')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Exportar CSV
        </div>
      </div>
    </div>
    <button class="btn btn-ghost" onclick="exportBase()" title="Guardar la agenda en un archivo de base">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span class="db-label">Guardar base</span>
    </button>
    <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()" title="Actualizar la agenda desde un archivo de base guardado">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span class="db-label">Actualizar base</span>
    </button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="handleImportFile(this)">
    <button class="btn btn-gold" onclick="openAddModal()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo contacto
    </button>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR OVERLAY MOBILE -->
  <div class="sidebar-mobile-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">Filtros</div>
    <div class="sidebar-filters">
      <div class="filter-group">
        <span class="filter-label">Aseguradora</span>
        <div class="filter-tags" id="companyTags"></div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Sector / Función</span>
        <select class="filter-select" id="sectorFilter" onchange="applyFilters()">
          <option value="">Todos los sectores</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Estado</span>
        <select class="filter-select" id="estadoFilter" onchange="applyFilters()">
          <option value="">Todos</option>
          <option value="activo">Activos</option>
          <option value="baja">Dados de baja</option>
        </select>
      </div>
      <button class="clear-btn" onclick="clearFilters()">✕ Limpiar filtros</button>
    </div>
    <div class="sidebar-stats">
      <div class="stat-row"><span style="color:var(--text-sec)">Mostrando</span><span class="stat-val" id="statShowing">—</span></div>
      <div class="stat-row"><span style="color:var(--text-sec)">Compañías</span><span class="stat-val" id="statCompanies">—</span></div>
      <div class="stat-row"><span style="color:var(--success)">Activos</span><span class="stat-val" id="statActivos" style="color:var(--success)">—</span></div>
      <div class="stat-row"><span style="color:var(--danger)">Dados de baja</span><span class="stat-val" id="statBajas" style="color:var(--danger)">—</span></div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent">
    <!-- DASHBOARD STATS -->
    <div class="dash-stats" id="dashStats">

// ==================== STATE ====================
let contacts=(JSON.parse(localStorage.getItem('contacts_data')||'null')||CONTACTS_DATA.map(c=>({...c}))).map(c=>({...c,estado:c.estado==='baja'?'baja':'activo'}));
let nextId = Math.max(...contacts.map(c=>c.id)) + 1;
let searchQuery = '';
let filterCompany = '';
let filterSector = '';
let filterEstado = '';
let currentView = 'accordion';
let expandedCompanies = new Set();
const AVATAR_COLORS = ['#1B3A5C','#2A4E73','#1E6BBA','#C8A04A','#7B3FA0','#1A7A4A','#C0392B','#16697A','#8B4513'];

// ==================== PERSISTENCE ====================
function saveContacts(){localStorage.setItem('contacts_data',JSON.stringify(contacts))}

// ==================== UTILS ====================
function initials(name){
  if(!name)return '?';
  const parts=name.trim().split(/\s+/);
  if(parts.length===1)return parts[0][0].toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function avatarColor(name){
  let h=0;for(const c of (name||''))h=(h*31+c.charCodeAt(0))%AVATAR_COLORS.length;
  return AVATAR_COLORS[h];
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function normalize(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}

// ==================== FILTERS ====================
function getFiltered(){
  let result=[...contacts];
  if(searchQuery){
    const q=normalize(searchQuery);
    result=result.filter(c=>
      normalize(c.nombre).includes(q)||
      normalize(c.aseguradora).includes(q)||
      normalize(c.funcion).includes(q)||
      normalize(c.mail).includes(q)||
      normalize(c.telefono).includes(q)
    );
  }
  if(filterCompany)result=result.filter(c=>c.aseguradora===filterCompany);
  if(filterSector)result=result.filter(c=>normalize(c.funcion).includes(normalize(filterSector)));
  if(filterEstado)result=result.filter(c=>(c.estado||'activo')===filterEstado);
  const sort=document.getElementById('sortSelect').value;
  if(sort==='name')result.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  else result.sort((a,b)=>a.aseguradora.localeCompare(b.aseguradora,'es'));
  return result;
}

// ==================== SIDEBAR ====================
function buildSidebar(){
  const companies=[...new Set(contacts.map(c=>c.aseguradora))].sort((a,b)=>a.localeCompare(b,'es'));
  const sectors=[...new Set(contacts.map(c=>c.funcion).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  // Company tags
  const ct=document.getElementById('companyTags');
  ct.innerHTML=companies.map(c=>`<span class="filter-tag${filterCompany===c?' active':''}" onclick="toggleCompanyFilter('${esc(c)}')">${esc(c)}</span>`).join('');
  // Sector select
  const ss=document.getElementById('sectorFilter');
  const cur=ss.value;
  ss.innerHTML='<option value="">Todos los sectores</option>'+sectors.map(s=>`<option value="${esc(s)}"${filterSector===s?' selected':''}>${esc(s)}</option>`).join('');
  if(cur)ss.value=cur;
}
function toggleCompanyFilter(company){
  filterCompany=filterCompany===company?'':company;
  buildSidebar();
  render();
}
function applyFilters(){
  filterSector=document.getElementById('sectorFilter').value;
  filterEstado=document.getElementById('estadoFilter').value;
  render();
}
function clearFilters(){
  filterCompany='';filterSector='';filterEstado='';searchQuery='';
  document.getElementById('searchInput').value='';
  document.getElementById('sectorFilter').value='';
  document.getElementById('estadoFilter').value='';
  buildSidebar();
  render();
}
function handleSearch(){
  searchQuery=document.getElementById('searchInput').value;
  render();
}

// ==================== RENDER ====================
function render(){
  const filtered=getFiltered();
  // Stats
  document.getElementById('statShowing').textContent=filtered.length;
  const companies=new Set(filtered.map(c=>c.aseguradora));
  document.getElementById('statCompanies').textContent=companies.size;
  document.getElementById('statActivos').textContent=contacts.filter(c=>c.estado!=='baja').length;
  document.getElementById('statBajas').textContent=contacts.filter(c=>c.estado==='baja').length;
  // Results info
  const hasFilter=searchQuery||filterCompany||filterSector||filterEstado;
  document.getElementById('resultsInfo').innerHTML=hasFilter
    ?`<strong>${filtered.length}</strong> resultado${filtered.length!==1?'s':''} de ${contacts.length} contactos`
    :`<strong>${contacts.length}</strong> contactos en <strong>${companies.size}</strong> aseguradoras`;
  // Content
  if(filtered.length===0){
    document.getElementById('contentArea').innerHTML=`<div class="empty"><svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><h3>Sin resultados</h3><p>No se encontraron contactos con esos criterios.<br>Probá ajustando la búsqueda o los filtros.</p></div>`;
    return;
  }
  if(currentView==='table')renderTable(filtered);
  else renderAccordion(filtered);
}
function renderAccordion(filtered){
  const grouped={};
  filtered.forEach(c=>{if(!grouped[c.aseguradora])grouped[c.aseguradora]=[];grouped[c.aseguradora].push(c);});
  const html=Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0],'es')).map(([company,list])=>{
    const isOpen=expandedCompanies.has(company)||(searchQuery||filterSector);
    const abbr=company.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
    const bg=avatarColor(company);
    return `<div class="acc-item">
      <div class="acc-header${isOpen?' open':''}" onclick="toggleAccordion('${esc(company)}',this)">
        <div class="acc-logo" style="background:${bg}">${esc(abbr)}</div>
        <span class="acc-name">${esc(company)}</span>
        <span class="acc-badge">${list.length} contacto${list.length!==1?'s':''}</span>
        <svg class="acc-chevron" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="acc-body${isOpen?' open':''}">
        <div class="contact-grid">${list.map(c=>contactCard(c)).join('')}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('contentArea').innerHTML=`<div class="accordion">${html}</div>`;
}
function renderTable(filtered){
  const rows=filtered.map(c=>{
    const baja=c.estado==='baja';
    return `<tr class="${baja?'baja':''}">
    <td><div style="display:flex;align-items:center;gap:8px">
      <div class="card-avatar" style="width:30px;height:30px;font-size:11px;background:${baja?'var(--danger)':avatarColor(c.aseguradora)}">${esc(initials(c.nombre))}</div>

  if(expandedCompanies.has(company))expandedCompanies.delete(company);
  else expandedCompanies.add(company);
  header.classList.toggle('open');
  const body=header.nextElementSibling;

// ==================== DASHBOARD STATS ====================
function updateDashStats(){
  document.getElementById('totalContacts').textContent=contacts.length;
  document.getElementById('totalCompanies').textContent=new Set(contacts.map(c=>c.aseguradora)).size;
  document.getElementById('totalMails').textContent=contacts.filter(c=>c.mail).length;

// ==================== MODAL ====================
function openModal(){document.getElementById('modalOverlay').style.display='flex'}
function closeModal(){document.getElementById('modalOverlay').style.display='none'}
function closeModalOnOverlay(e){if(e.target===document.getElementById('modalOverlay'))closeModal()}

function getContactForm(contact,companies){
  return `<div class="form-group">
    <label class="form-label">Aseguradora *</label>
    <input list="companies-list" class="form-input" id="f-aseguradora" value="${esc(contact?.aseguradora||'')}" placeholder="Nombre de aseguradora">
    <datalist id="companies-list">${companies.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <div class="form-hint" style="font-size:11px;color:var(--text-hint);margin-top:4px">Si la aseguradora todavía no está en la agenda, escribila igual: al guardar se agrega a la lista de filtros, búsqueda y ordenamiento.</div>
    <div class="form-error" id="err-aseguradora"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Nombre y Apellido</label>
    <input class="form-input" id="f-nombre" value="${esc(contact?.nombre||'')}" placeholder="Nombre completo">
  </div>
  <div class="form-group">
    <label class="form-label">Función / Sector</label>
    <input class="form-input" id="f-funcion" value="${esc(contact?.funcion||'')}" placeholder="Cargo o sector">
  </div>
  <div class="form-group">
    <label class="form-label">E-mail</label>
    <input class="form-input" id="f-mail" type="email" value="${esc(contact?.mail||'')}" placeholder="correo@empresa.com.ar">
    <div class="form-error" id="err-mail"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Teléfono</label>
    <input class="form-input" id="f-telefono" value="${esc(contact?.telefono||'')}" placeholder="+54 11 XXXX-XXXX">
  </div>
  <div class="form-group">
    <label class="form-label">Estado del contacto</label>
    <select class="form-select" id="f-estado">
      <option value="activo"${(contact?.estado||'activo')==='activo'?' selected':''}>Activo</option>
      <option value="baja"${contact?.estado==='baja'?' selected':''}>Dado de baja</option>
    </select>
  </div>`;
}
function validateForm(){
  let ok=true;
  const ase=document.getElementById('f-aseguradora').value.trim();
  const mail=document.getElementById('f-mail').value.trim();
  if(!ase){document.getElementById('err-aseguradora').textContent='La aseguradora es obligatoria.';document.getElementById('f-aseguradora').classList.add('error');ok=false;}
  else{document.getElementById('err-aseguradora').textContent='';document.getElementById('f-aseguradora').classList.remove('error');}
  if(mail&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){document.getElementById('err-mail').textContent='Formato de e-mail inválido.';document.getElementById('f-mail').classList.add('error');ok=false;}
  else{document.getElementById('err-mail').textContent='';document.getElementById('f-mail').classList.remove('error');}
  return ok;
}
function getFormValues(){
  return{
    aseguradora:document.getElementById('f-aseguradora').value.trim(),
    nombre:document.getElementById('f-nombre').value.trim(),
    funcion:document.getElementById('f-funcion').value.trim(),
    mail:document.getElementById('f-mail').value.trim(),
    telefono:document.getElementById('f-telefono').value.trim(),
    estado:document.getElementById('f-estado').value==='baja'?'baja':'activo'
  };
}
function openAddModal(){
  const companies=[...new Set(contacts.map(c=>c.aseguradora))].sort((a,b)=>a.localeCompare(b,'es'));
  document.getElementById('modalTitle').textContent='Nuevo contacto';
  document.getElementById('modalBody').innerHTML=getContactForm(null,companies);
  document.getElementById('modalFooter').innerHTML=`<button class="btn" style="background:var(--bg);border:1px solid var(--border);color:var(--text-sec)" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveNewContact()">Guardar contacto</button>`;
  openModal();
}
function saveNewContact(){
  if(!validateForm())return;
  const vals=getFormValues();
  contacts.push({...vals,id:nextId++});
  saveContacts();updateDashStats();buildSidebar();render();closeModal();
  showToast('Contacto agregado correctamente','success');
}
function openEditModal(id){
  const c=contacts.find(x=>x.id===id);if(!c)return;
  const companies=[...new Set(contacts.map(x=>x.aseguradora))].sort((a,b)=>a.localeCompare(b,'es'));
  document.getElementById('modalTitle').textContent='Editar contacto';
  document.getElementById('modalBody').innerHTML=getContactForm(c,companies);
  document.getElementById('modalFooter').innerHTML=`<button class="btn" style="background:var(--bg);border:1px solid var(--border);color:var(--text-sec)" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveEditContact(${id})">Guardar cambios</button>`;
  openModal();
}
function saveEditContact(id){
  if(!validateForm())return;
  const vals=getFormValues();
  const idx=contacts.findIndex(c=>c.id===id);
  if(idx>-1){contacts[idx]={...contacts[idx],...vals};}
  saveContacts();updateDashStats();buildSidebar();render();closeModal();
  showToast('Contacto actualizado','success');
}
function openDeleteModal(id){
  const c=contacts.find(x=>x.id===id);if(!c)return;
  document.getElementById('modalTitle').textContent='Eliminar contacto';
  document.getElementById('modalBody').innerHTML=`<p class="confirm-text">¿Estás seguro de que querés eliminar a <span class="confirm-name">${esc(c.nombre||c.funcion)}</span> de <strong>${esc(c.aseguradora)}</strong>?<br><br>Esta acción no se puede deshacer.</p>`;
  document.getElementById('modalFooter').innerHTML=`<button class="btn" style="background:var(--bg);border:1px solid var(--border);color:var(--text-sec)" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="confirmDelete(${id})">Eliminar contacto</button>`;
  openModal();
}
function confirmDelete(id){
  contacts=contacts.filter(c=>c.id!==id);
  saveContacts();updateDashStats();buildSidebar();render();closeModal();
  showToast('Contacto eliminado','danger');
}
function toggleEstado(id){
  const c=contacts.find(x=>x.id===id);if(!c)return;
  c.estado=c.estado==='baja'?'activo':'baja';
  saveContacts();updateDashStats();render();
  showToast((c.nombre||'Contacto')+(c.estado==='baja'?' dado de baja':' reactivado'),c.estado==='baja'?'danger':'success');
}

// ==================== COPIAR ====================
function copyText(text,msg){
  const ok=()=>showToast(msg||'Copiado al portapapeles','success');
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();ta.setSelectionRange(0,text.length);
    let done=false;
    try{done=document.execCommand('copy')}catch(e){done=false}
    document.body.removeChild(ta);
    if(done)ok();else showToast('No se pudo copiar. Seleccioná y copiá manualmente.','danger');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  }else fallback();
}
function contactText(c){
  const L=[];
  if(c.nombre)L.push(c.nombre);
  const sub=[c.funcion,c.aseguradora].filter(Boolean).join(' — ');
  if(sub)L.push(sub);
  if(c.mail)L.push('Mail: '+c.mail);
  if(c.telefono)L.push('Teléfono: '+c.telefono);
  return L.join('\n');
}
function copyContact(id){
  const c=contacts.find(x=>x.id===id);if(!c)return;
  copyText(contactText(c),'Datos de '+(c.nombre||'el contacto')+' copiados');
}
function copyMail(id){
  const c=contacts.find(x=>x.id===id);if(!c||!c.mail)return;
  copyText(c.mail,'Mail copiado');
}

// ==================== EXPORT ====================
function toggleExportMenu(){
  const m=document.getElementById('exportMenu');
  m.style.display=m.style.display==='none'?'block':'none';
}
document.addEventListener('click',function(e){
  if(!document.getElementById('exportBtn').contains(e.target))
    document.getElementById('exportMenu').style.display='none';
});
function exportData(format){
  document.getElementById('exportMenu').style.display='none';
  const filtered=getFiltered();
  if(format==='csv'){
    const header='Aseguradora,Nombre y Apellido,Función / Sector,Mail,Teléfono\n';
    const rows=filtered.map(c=>[c.aseguradora,c.nombre,c.funcion,c.mail,c.telefono].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob=new Blob(['\ufeff'+header+rows],{type:'text/csv;charset=utf-8'});
    downloadBlob(blob,'contactos_aseguradoras.csv');
    showToast(`${filtered.length} contactos exportados a CSV`,'success');
  } else {
    // Simple XLSX-like format using HTML table (can be opened in Excel)
    const html=`<html><head><meta charset="UTF-8"></head><body><table><tr><th>Aseguradora</th><th>Nombre y Apellido</th><th>Función / Sector</th><th>Mail</th><th>Teléfono</th></tr>${filtered.map(c=>`<tr><td>${c.aseguradora}</td><td>${c.nombre}</td><td>${c.funcion}</td><td>${c.mail}</td><td>${c.telefono}</td></tr>`).join('')}</table></body></html>`;
    const blob=new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8'});
    downloadBlob(blob,'contactos_aseguradoras.xls');
    showToast(`${filtered.length} contactos exportados a Excel`,'success');
  }
}
function downloadBlob(blob,filename){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
}

// ==================== BASE (GUARDAR / CARGAR) ====================
function baseFileName(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return 'Actualizacion-'+p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear()+'.json';
}
async function exportBase(){
  const blob=new Blob([JSON.stringify(contacts,null,2)],{type:'application/json;charset=utf-8'});
  const name=baseFileName();
  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({suggestedName:name,types:[{description:'Archivo JSON',accept:{'application/json':['.json']}}]});
      const w=await handle.createWritable();
      await w.write(blob);
      await w.close();
      showToast('Base guardada: '+handle.name+' ('+contacts.length+' contactos)','success');
      return;
    }catch(err){
      if(err&&err.name==='AbortError')return;
    }
  }
  downloadBlob(blob,name);
  showToast('Base descargada: '+name+' ('+contacts.length+' contactos)','success');
}
function handleImportFile(input){
  const file=input.files&&input.files[0];
  input.value='';
  if(!file)return;
  if(!window.confirm('¿Reemplazar toda la agenda ('+contacts.length+' contactos actuales) por los datos de "'+file.name+'?"\n\nSe perderán los cambios locales que no hayas guardado.'))return;
  const reader=new FileReader();
  reader.onload=function(){
    let data;
    try{data=JSON.parse(reader.result);}catch(e){showToast('El archivo no es un JSON válido.','danger');return;}
    if(!Array.isArray(data)||data.length===0||!data.every(c=>c&&typeof c==='object'&&('aseguradora' in c))){
      showToast('El archivo no tiene el formato de la agenda.','danger');return;
    }
    contacts=data.map((c,i)=>({
      aseguradora:String(c.aseguradora||''),
      nombre:String(c.nombre||''),
      funcion:String(c.funcion||''),
      mail:String(c.mail||''),
      telefono:String(c.telefono||''),
      estado:c.estado==='baja'?'baja':'activo',
      id:i+1
    }));
    nextId=contacts.length+1;
    saveContacts();updateDashStats();clearFilters();
    showToast('Base actualizada: '+contacts.length+' contactos desde '+file.name,'success');
  };
  reader.onerror=function(){showToast('No se pudo leer el archivo.','danger');};
  reader.readAsText(file,'utf-8');
}

// ==================== TOAST ====================
let toastTimer;
function showToast(msg,type=''){
  clearTimeout(toastTimer);
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(type||'');
  t.classList.add('show');
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

  document.getElementById('sidebarOverlay').classList.toggle('open');
